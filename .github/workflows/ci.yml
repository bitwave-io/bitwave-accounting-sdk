name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The format/compat suite exercises real hledger / ledger / bean-check
      # binaries when present and skips per-tool when absent, so this step is
      # best-effort: a failed install degrades coverage, not the build.
      - name: Install cross-tool compat binaries
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y hledger ledger
          pipx install beancount
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
